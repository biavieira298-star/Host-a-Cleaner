<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f0f4f8">
    <title>Confirmação do pagamento | Host a Cleaner</title>
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #f0f4f8;
            color: #0f172a;
            font-family: system-ui, sans-serif;
        }
        main {
            width: min(100%, 30rem);
            padding: 2rem;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            background: #fff;
            text-align: center;
            box-shadow: 0 16px 40px rgb(15 23 42 / 8%);
        }
        img { width: 64px; height: 64px; }
        h1 { margin: 1.25rem 0 0.75rem; font-size: 1.35rem; }
        p { color: #475569; line-height: 1.6; }
        .spinner {
            width: 2rem;
            height: 2rem;
            margin: 1.5rem auto;
            border: 3px solid #e0e7ff;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            background: #4f46e5;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #4338ca; }
        a:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
        [hidden] { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/status-success.js" defer></script>
</head>
<body>
    <main>
        <img src="images/icon-192.png" alt="Host a Cleaner">
        <div role="status" aria-live="polite">
            <h1 id="payment-title">A confirmar o teu pagamento...</h1>
            <div id="payment-spinner" class="spinner" aria-hidden="true"></div>
            <p id="payment-message">Estamos a atualizar o teu plano. Aguarda um momento.</p>
        </div>
        <a id="return-to-dashboard" href="index.html" hidden>Regressar ao painel</a>
        <noscript><p>Ativa o JavaScript para confirmar o pagamento.</p><a href="index.html">Regressar ao painel</a></noscript>
    </main>
</body>
</html>
